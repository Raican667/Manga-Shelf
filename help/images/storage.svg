<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Manga-Regal local data flow</title>
  <desc id="desc">Manga metadata and cover data use separate local storage; covers load only when visible and are excluded from Sync.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 9 3 0 6z" fill="#8d7f91"/></marker><filter id="shadow"><feDropShadow dy="10" stdDeviation="12" flood-opacity=".3"/></filter></defs><rect width="1200" height="560" fill="#100d13"/><text x="60" y="63" fill="#e26042" font-family="Arial" font-size="11" font-weight="700" letter-spacing="2">LOCAL DATA FLOW</text><text x="60" y="101" fill="#f7f0f4" font-family="Georgia" font-size="28" font-weight="700">Fast collection · protected Firefox profile</text>
  <g filter="url(#shadow)" font-family="Arial"><rect x="60" y="170" width="215" height="220" rx="18" fill="#211a26" stroke="#493b4d"/><circle cx="167" cy="228" r="37" fill="#e26042" opacity=".15"/><path d="M148 205h38v47h-38zm8-9h22v10h-22z" fill="none" stroke="#e26042" stroke-width="4"/><text x="167" y="302" text-anchor="middle" fill="#f7f0f4" font-size="16" font-weight="700">SAVE</text><text x="167" y="330" text-anchor="middle" fill="#a99eac" font-size="11">title · URL · chapter</text><text x="167" y="350" text-anchor="middle" fill="#a99eac" font-size="11">rating · tags · cover</text>
  <rect x="392" y="145" width="276" height="145" rx="18" fill="#211a26" stroke="#493b4d"/><ellipse cx="458" cy="190" rx="31" ry="12" fill="#77c596" opacity=".22"/><path d="M427 190v37c0 7 14 12 31 12s31-5 31-12v-37" fill="none" stroke="#77c596" stroke-width="3"/><ellipse cx="458" cy="190" rx="31" ry="12" fill="none" stroke="#77c596" stroke-width="3"/><text x="516" y="185" fill="#f7f0f4" font-size="15" font-weight="700">DATA</text><text x="516" y="211" fill="#a99eac" font-size="11">small · searchable</text><text x="516" y="234" fill="#a99eac" font-size="11">Sync metadata only</text>
  <rect x="392" y="316" width="276" height="145" rx="18" fill="#211a26" stroke="#493b4d"/><rect x="427" y="346" width="63" height="78" rx="6" fill="#e26042" opacity=".22"/><path d="m436 409 16-22 14 14 11-11 8 19z" fill="#e26042"/><circle cx="476" cy="363" r="7" fill="#edc26b"/><text x="516" y="356" fill="#f7f0f4" font-size="15" font-weight="700">COVERS</text><text x="516" y="382" fill="#a99eac" font-size="11">separate · local</text><text x="516" y="405" fill="#a99eac" font-size="11">reuse on updates</text>
  <rect x="795" y="145" width="330" height="145" rx="18" fill="#211a26" stroke="#493b4d"/><rect x="827" y="177" width="77" height="82" rx="7" fill="#2e2634"/><path d="m835 246 21-28 17 18 14-15 12 25z" fill="#e26042" opacity=".7"/><path d="M921 187h171M921 207h147M921 227h161M921 247h116" stroke="#4a3d50" stroke-width="8" stroke-linecap="round"/><text x="960" y="317" text-anchor="middle" fill="#77c596" font-size="12" font-weight="700">LOAD WHEN VISIBLE</text>
  <rect x="795" y="316" width="330" height="145" rx="18" fill="#211a26" stroke="#493b4d"/><path d="M833 349h57l17 17v60h-74z" fill="none" stroke="#edc26b" stroke-width="3"/><path d="M890 349v18h17" fill="none" stroke="#edc26b" stroke-width="3"/><text x="928" y="368" fill="#f7f0f4" font-size="15" font-weight="700">JSON BACKUP</text><text x="928" y="394" fill="#a99eac" font-size="11">data + settings + covers</text><text x="928" y="417" fill="#a99eac" font-size="11">portable file</text></g>
  <g fill="none" stroke="#8d7f91" stroke-width="3" marker-end="url(#arrow)"><path d="M275 250h70q25 0 25-25v-7q0-25 22-25"/><path d="M275 304h70q25 0 25 25v34q0 25 22 25"/><path d="M668 217h127"/><path d="M668 388h127"/></g><g font-family="Arial" font-size="11" font-weight="700"><rect x="298" y="221" width="58" height="22" rx="11" fill="#352b39"/><text x="327" y="236" text-anchor="middle" fill="#ddd2df">split</text><rect x="700" y="192" width="72" height="22" rx="11" fill="#352b39"/><text x="736" y="207" text-anchor="middle" fill="#ddd2df">visible</text><rect x="700" y="362" width="72" height="22" rx="11" fill="#352b39"/><text x="736" y="377" text-anchor="middle" fill="#ddd2df">backup</text></g>
