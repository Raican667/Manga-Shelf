<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Manga-Regal collection table</title>
  <desc id="desc">A collection table with lazy cover previews, filters, sortable headers, ratings, status and action icons.</desc>
  <rect width="1200" height="650" fill="#100d13"/><rect x="36" y="35" width="1128" height="580" rx="20" fill="#17131b" stroke="#3b3040"/>
