  <g font-family="Arial" font-size="11" font-weight="700"><text x="70" y="555" fill="#e26042">① sortable headers</text><text x="385" y="555" fill="#edc26b">② filters and stars</text><text x="750" y="555" fill="#77c596">③ edit / remove</text></g>
