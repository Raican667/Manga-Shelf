  <g font-family="Arial" font-size="12" font-weight="700"><rect x="68" y="135" width="112" height="27" rx="9" fill="#342125"/><text x="86" y="153" fill="#f2d5ce">READING</text><text x="204" y="153" fill="#9e929f">ACTIVE</text><text x="281" y="153" fill="#9e929f">HOLD</text><text x="337" y="153" fill="#9e929f">DROPPED</text><text x="427" y="153" fill="#9e929f">DONE</text><text x="493" y="153" fill="#9e929f">ALL</text><text x="1025" y="153" fill="#9e929f">SETTINGS</text></g>
