name: Publish browser packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Raican667/MangaShelf-Public'
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Validate version and build both packages
        shell: pwsh
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          $version = (Get-Content manifest.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_REF_TYPE -eq 'tag' -and $env:RELEASE_REF_NAME -ne "v$version") {
            throw 'Tag and manifest versions must match'
          }
          .\build.ps1
          node scripts/release-notes.js
          if ($LASTEXITCODE -ne 0) { throw 'Release notes failed' }
      - name: Publish release with Firefox and Chrome downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content manifest.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $assets = @("build/manga-regal-firefox-$version.zip", "build/manga-regal-chrome-$version.zip")
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --verify-tag --title "Manga-Regal / Manga Shelf $version" --notes-file build/release-notes.md --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Publishing browser packages failed' }
